name: Resize uploaded images

# Triggers when files under images/ change on main.
# Loop guard: the action's own commit message has [auto-resize].
on:
  push:
    branches: [main]
    paths:
      - "images/**"

permissions:
  contents: write

jobs:
  resize:
    if: "!contains(github.event.head_commit.message, '[auto-resize]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sharp
        run: npm init -y >/dev/null && npm install --no-save sharp@0.33.5

      - name: Find images changed in this commit
        id: changed
        run: |
          git diff --diff-filter=AM --name-only HEAD^ HEAD \
            | grep -Ei '^images/.*\.(jpe?g|png|webp)$' \
            > /tmp/changed.txt || true
          echo "Files to consider:"
          cat /tmp/changed.txt || true
          echo "count=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Resize oversized images
        if: steps.changed.outputs.count != '0'
        id: resize
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const sharp = require('sharp');

          const MAX_W = 2000;
          const MAX_BYTES = 1024 * 1024; // 1 MB

          const files = fs.readFileSync('/tmp/changed.txt', 'utf8')
            .split('\n').filter(Boolean);

          (async () => {
            let changedAny = false;
            for (const file of files) {
              if (!fs.existsSync(file)) {
                console.log(`skip ${file} (no longer exists)`);
                continue;
              }
              try {
                const size = fs.statSync(file).size;
                const meta = await sharp(file).metadata();
                const width = meta.width || 0;
                console.log(`consider ${file} (width=${width}px, size=${size}B)`);
                if (width <= MAX_W && size <= MAX_BYTES) {
                  console.log(`  -> under thresholds, skip`);
                  continue;
                }
                // Pipeline: rotate based on EXIF, resize to max width, strip EXIF.
                const ext = path.extname(file).toLowerCase();
                let pipeline = sharp(file).rotate().resize({ width: MAX_W, withoutEnlargement: true });
                if (ext === '.jpg' || ext === '.jpeg') {
                  pipeline = pipeline.jpeg({ quality: 88, mozjpeg: true });
                } else if (ext === '.png') {
                  pipeline = pipeline.png({ compressionLevel: 9 });
                } else if (ext === '.webp') {
                  pipeline = pipeline.webp({ quality: 88 });
                }
                const tmp = file + '.tmp';
                await pipeline.toFile(tmp);
                fs.renameSync(tmp, file);
                const newSize = fs.statSync(file).size;
                const newMeta = await sharp(file).metadata();
                console.log(`  -> done: ${newMeta.width}px, ${newSize}B`);
                changedAny = true;
              } catch (err) {
                console.log(`  -> ERROR on ${file}: ${err.message}`);
              }
            }
            // Write step output for the next step to consume
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed_any=${changedAny ? 1 : 0}\n`);
            console.log(`changed_any=${changedAny ? 1 : 0}`);
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

      - name: Commit resized images
        if: steps.resize.outputs.changed_any == '1'
        run: |
          git config user.name  "auto-resize-bot"
          git config user.email "bot@noxta.studio"
          if [ -z "$(git status --porcelain images/)" ]; then
            echo "No diff after resize — nothing to commit."
            exit 0
          fi
          git add images/
          git commit -m "[auto-resize] shrink oversized uploads"

          # Retry push with rebase up to 5 times — admin commits can land
          # while this action is running, leaving us with a stale main.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push $attempt rejected; fetch+rebase and retry…"
            git fetch origin main
            if ! git rebase origin/main; then
              # A conflict here means a concurrent admin commit deleted or
              # replaced one of the images we just resized. Our resize is then
              # obsolete: the photo is gone, or the new upload has its own
              # resize run queued. Nothing useful left to commit — skip
              # cleanly instead of failing the run with a false alarm.
              echo "Image was deleted/replaced upstream during resize — skipping."
              git rebase --abort || true
              exit 0
            fi
          done
          echo "Push still failing after 5 attempts." >&2
          exit 1
