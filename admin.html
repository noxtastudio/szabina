<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Szabina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0c05;
    --paper:#faf2e0;
    --paper-dim:rgba(250,242,224,0.78);
    --paper-faint:rgba(250,242,224,0.18);
    --terra:#b8401b;
    --terra-deep:#7a2a10;
    --ok:#6f9d5d;
    --warn:#c0833a;
    --err:#c44a3e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--paper);
    font-family:"Cormorant Garamond", Georgia, serif;font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace}
  .sc{font-family:"IBM Plex Mono", monospace;text-transform:uppercase;letter-spacing:0.22em;font-size:11px}

  /* ───────── Login screen ───────── */
  .login{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login form{
    width:100%;max-width:380px;
    display:flex;flex-direction:column;gap:18px;
  }
  .login .eyebrow{color:var(--terra);margin-bottom:6px}
  .login h1{
    font-weight:300;font-size:clamp(36px,5vw,52px);
    line-height:1;letter-spacing:-0.015em;
    margin-bottom:8px;
  }
  .login h1 em{font-style:italic;color:var(--terra-deep)}
  .login p{color:var(--paper-dim);font-style:italic;font-size:17px;line-height:1.5;margin-bottom:8px}
  .login input{
    width:100%;padding:14px 16px;
    background:rgba(250,242,224,0.05);
    border:1px solid var(--paper-faint);
    border-radius:10px;
    color:var(--paper);font-family:inherit;font-size:17px;
    transition:border-color .2s,background .2s;
  }
  .login input:focus{outline:0;border-color:var(--terra);background:rgba(250,242,224,0.08)}
  .login button{
    padding:14px 22px;font-family:inherit;font-size:14px;
    background:var(--terra);color:var(--paper);
    border:0;border-radius:10px;cursor:pointer;
    letter-spacing:0.2em;text-transform:uppercase;
    transition:background .2s;
  }
  .login button:hover{background:var(--terra-deep)}
  .login .err{color:var(--err);font-size:13px;font-style:italic;min-height:1.4em}

  /* ───────── App layout (after login) ───────── */
  .app{display:none;height:100vh;
    grid-template-columns:320px 1fr;
    grid-template-rows:auto auto 1fr;
    grid-template-areas:
      "topbar topbar"
      "sidebar savebar"
      "sidebar editor";
  }
  .app.live{display:grid}
  .topbar{grid-area:topbar}
  .sidebar{grid-area:sidebar}
  .editor{grid-area:editor}

  .topbar{
    grid-column:1/-1;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;
    border-bottom:1px solid var(--paper-faint);
    background:rgba(0,0,0,0.25);
  }
  .topbar .brand{font-size:14px;letter-spacing:0.32em;text-transform:uppercase;font-weight:500}
  .topbar .brand em{font-style:italic;color:var(--terra);text-transform:none;letter-spacing:0;font-weight:300;font-size:18px;margin-left:8px}
  .topbar .actions{display:flex;gap:8px;align-items:center}
  .topbar a, .topbar button{
    color:var(--paper-dim);background:transparent;border:0;
    font-family:inherit;font-size:13px;cursor:pointer;
    padding:6px 12px;border-radius:6px;
    transition:color .2s,background .2s;
  }
  .topbar a:hover, .topbar button:hover{color:var(--paper);background:rgba(250,242,224,0.06)}

  /* Story list (left) */
  .sidebar{
    border-right:1px solid var(--paper-faint);
    overflow-y:auto;
    padding:8px 0;
  }
  .sidebar h2{
    font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:0.22em;
    font-size:10px;font-weight:400;color:var(--paper-dim);
    padding:14px 22px 8px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .sidebar h2 .new-btn{
    background:transparent;border:1px solid var(--paper-faint);color:var(--paper-dim);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:0.18em;
    padding:3px 10px;border-radius:14px;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .sidebar h2 .new-btn:hover{
    background:var(--terra);color:var(--paper);border-color:var(--terra);
  }
  .story-item.new{
    color:#ffb88c;font-style:italic;
  }
  .story-item.new .title:before{content:"✨ "}
  .story-item{
    display:block;width:100%;text-align:left;
    background:transparent;border:0;color:var(--paper);
    font-family:inherit;cursor:grab;
    padding:10px 22px;
    border-left:2px solid transparent;
    transition:background .15s,border-color .15s,opacity .15s;
  }
  .story-item:active{cursor:grabbing}
  .story-item:hover{background:rgba(250,242,224,0.04)}
  .story-item.active{background:rgba(184,64,27,0.12);border-left-color:var(--terra)}
  .story-item.dragging{opacity:0.35}
  .story-item.drop-before{box-shadow:inset 0 3px 0 var(--terra)}
  .story-item.drop-after{box-shadow:inset 0 -3px 0 var(--terra)}
  .story-item .num{
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--paper-dim);
    letter-spacing:0.18em;margin-right:10px;
  }
  .story-item .title{font-size:17px;line-height:1.25}
  .story-item .title em{font-style:italic;color:#ffb88c}
  .story-item .sub{
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--paper-dim);
    letter-spacing:0.1em;margin-top:4px;text-transform:uppercase;
  }

  /* Editor (right) */
  .editor{
    overflow-y:auto;
    padding:32px 48px;
  }
  .editor.empty{
    display:flex;align-items:center;justify-content:center;
    color:var(--paper-dim);font-style:italic;font-size:19px;
  }
  .editor .row{display:flex;gap:24px;align-items:baseline;margin-bottom:20px}
  .editor .row .num{
    font-family:"Cormorant Garamond",serif;font-style:italic;
    font-size:48px;color:var(--terra);line-height:1;
  }
  .editor .row .place{color:var(--paper-dim);font-size:14px;letter-spacing:0.18em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
  .editor h2{
    font-weight:300;font-size:clamp(36px,4vw,56px);line-height:1;
    letter-spacing:-0.015em;margin-bottom:18px;
  }
  .editor h2 em{font-style:italic;color:#ffb88c}
  .editor .caption{
    font-style:italic;font-size:19px;line-height:1.55;color:var(--paper-dim);
    max-width:60ch;margin-bottom:32px;
  }
  .editor .meta-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:18px 32px;
    margin-bottom:28px;font-size:14px;
    border-top:1px solid var(--paper-faint);padding-top:24px;
  }
  .editor .meta-grid dt{
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;
  }
  .editor .meta-grid dd{font-family:"IBM Plex Mono",monospace;font-size:13px;margin-top:4px}
  .editor .images{
    border-top:1px solid var(--paper-faint);padding-top:24px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px;
  }

  /* ───── Edit form ───── */
  .savebar{
    grid-area:savebar;
    display:none;          /* hidden until a story is selected */
    justify-content:space-between;align-items:center;gap:14px;
    padding:14px 48px;
    background:rgba(0,0,0,0.35);
    border-bottom:1px solid var(--paper-faint);
  }
  .savebar.live{display:flex}
  .savebar .status{color:var(--paper-dim);font-size:13px;font-style:italic}
  .savebar .status.dirty{color:var(--warn)}
  .savebar .status.saving{color:var(--paper-dim)}
  .savebar .status.saved{color:var(--ok)}
  .savebar .status.err{color:var(--err)}
  .savebar .btns{display:flex;gap:8px}
  .savebar button{
    padding:8px 18px;font-family:inherit;font-size:12px;
    border:1px solid var(--paper-faint);border-radius:6px;cursor:pointer;
    background:transparent;color:var(--paper);
    letter-spacing:0.18em;text-transform:uppercase;
    transition:background .15s,border-color .15s,color .15s;
  }
  .savebar button:hover:not(:disabled){background:rgba(250,242,224,0.08)}
  .savebar button.save{background:var(--terra);border-color:var(--terra)}
  .savebar button.save:hover:not(:disabled){background:var(--terra-deep);border-color:var(--terra-deep)}
  .savebar button:disabled{opacity:.4;cursor:not-allowed}

  .form{display:flex;flex-direction:column;gap:18px;margin-bottom:32px}
  .form .field{display:flex;flex-direction:column;gap:6px}
  .form .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .form label{
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;
  }
  .form input, .form textarea{
    background:rgba(250,242,224,0.04);
    border:1px solid var(--paper-faint);border-radius:8px;
    color:var(--paper);font-family:inherit;
    padding:12px 14px;
    transition:border-color .15s,background .15s;
  }
  .form input:focus, .form textarea:focus{
    outline:0;border-color:var(--terra);background:rgba(250,242,224,0.08);
  }
  .form textarea{resize:vertical;min-height:90px;font-size:17px;font-style:italic;line-height:1.5}
  .form input.big{font-size:28px;font-weight:300;line-height:1.1;letter-spacing:-0.01em;padding:14px 16px}
  .form .hint{
    color:var(--paper-dim);font-size:11px;font-style:italic;
    font-family:"IBM Plex Mono",monospace;letter-spacing:0;
  }
  .form .hint code{
    background:rgba(250,242,224,0.08);padding:1px 5px;border-radius:3px;
    font-size:10px;color:#ffb88c;
  }

  .preview-wrap{
    border-top:1px solid var(--paper-faint);
    padding-top:24px;margin-bottom:32px;
  }
  .preview-wrap > .lbl{
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    margin-bottom:12px;
  }
  .preview{
    background:rgba(250,242,224,0.03);
    border-radius:10px;padding:24px;
  }
  .preview h2{
    font-weight:300;font-size:clamp(28px,3vw,42px);line-height:1;
    letter-spacing:-0.015em;margin-bottom:14px;
  }
  .preview h2 em{font-style:italic;color:#ffb88c}
  .preview .caption{
    font-style:italic;font-size:17px;line-height:1.55;color:var(--paper-dim);
    max-width:60ch;
  }
  .editor .images h3{
    grid-column:1/-1;
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:400;
    margin-bottom:4px;
  }
  .editor .images .thumb{
    aspect-ratio:1;position:relative;
    background:#000 center/cover no-repeat;
    border-radius:6px;
    border:1px solid var(--paper-faint);
    cursor:grab;
    transition:transform .15s,border-color .15s,opacity .15s;
  }
  .editor .images .thumb:hover{border-color:rgba(250,242,224,0.4)}
  .editor .images .thumb.cover{border-color:var(--terra);border-width:2px}
  .editor .images .thumb.dragging{opacity:.3;cursor:grabbing}
  .editor .images .thumb.drop-before{box-shadow:inset 3px 0 0 var(--terra)}
  .editor .images .thumb.drop-after{box-shadow:inset -3px 0 0 var(--terra)}
  .editor .images .thumb .badge{
    position:absolute;top:6px;left:6px;
    background:var(--terra);color:var(--paper);
    font-family:"IBM Plex Mono",monospace;font-size:9px;
    padding:2px 6px;border-radius:3px;letter-spacing:0.1em;
    pointer-events:none;
  }
  .editor .images .thumb .seq{
    position:absolute;bottom:6px;right:6px;
    background:rgba(0,0,0,0.6);color:var(--paper);
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    padding:2px 6px;border-radius:3px;
    pointer-events:none;
  }
  .editor .images .thumb .controls{
    position:absolute;top:6px;right:6px;
    display:flex;gap:4px;
    opacity:0;transition:opacity .15s;
  }
  .editor .images .thumb:hover .controls{opacity:1}
  .editor .images .thumb .controls button{
    width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,0.7);
    border:1px solid rgba(250,242,224,0.2);
    color:var(--paper);font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .15s,border-color .15s;
  }
  .editor .images .thumb .controls .set-cover:hover{background:var(--terra);border-color:var(--terra)}
  .editor .images .thumb .controls .del:hover{background:var(--err);border-color:var(--err)}
  .editor .images .thumb .controls .hide-toggle:hover{background:var(--paper);color:var(--ink, #1a0c05);border-color:var(--paper)}

  /* Hidden-from-gallery state */
  .editor .images .thumb.hidden-in-gallery{opacity:0.55;filter:grayscale(0.7)}
  .editor .images .thumb.hidden-in-gallery .controls .hide-toggle{
    background:var(--paper);color:#1a0c05;border-color:var(--paper);opacity:1;
  }
  .editor .images .thumb.hidden-in-gallery::after{
    content:"HIDDEN";
    position:absolute;left:6px;bottom:30px;
    background:rgba(0,0,0,0.75);color:var(--paper);
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:0.1em;
    padding:2px 6px;border-radius:3px;pointer-events:none;
  }

  /* Upload tile — first item in the grid */
  .editor .images .upload-tile{
    aspect-ratio:1;
    background:rgba(250,242,224,0.04);
    border:2px dashed var(--paper-faint);
    border-radius:6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;cursor:pointer;
    color:var(--paper-dim);
    transition:border-color .15s,background .15s,color .15s;
  }
  .editor .images .upload-tile:hover, .editor .images .upload-tile.over{
    border-color:var(--terra);background:rgba(184,64,27,0.08);color:var(--paper);
  }
  .editor .images .upload-tile .plus{font-size:32px;font-weight:300;line-height:1}
  .editor .images .upload-tile .lbl{
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    text-transform:uppercase;letter-spacing:0.18em;text-align:center;
  }
  .editor .images .upload-tile.busy{cursor:wait;border-style:solid}
  .editor .images .upload-tile.busy .plus{display:none}

  /* Danger zone — at the bottom of the editor pane */
  .danger{
    margin-top:48px;padding-top:24px;
    border-top:1px solid var(--paper-faint);
  }
  .danger h3{
    color:var(--err);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:400;
    margin-bottom:12px;
  }
  .danger p{color:var(--paper-dim);font-size:13px;font-style:italic;margin-bottom:14px;max-width:60ch}
  .danger button{
    padding:10px 18px;font-family:inherit;font-size:12px;cursor:pointer;
    background:transparent;color:var(--err);
    border:1px solid var(--err);border-radius:8px;
    letter-spacing:0.18em;text-transform:uppercase;
    transition:background .15s,color .15s;
  }
  .danger button:hover{background:var(--err);color:var(--paper)}

  .toast{
    position:fixed;bottom:24px;right:24px;
    padding:14px 22px;border-radius:10px;
    background:rgba(0,0,0,0.8);border:1px solid var(--paper-faint);
    color:var(--paper);font-size:13px;
    opacity:0;transform:translateY(8px);
    transition:opacity .2s,transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{border-color:var(--err);color:var(--err)}
</style>
</head>
<body>

<!-- ───── Login ───── -->
<section class="login" id="login">
  <form id="login-form" autocomplete="off">
    <span class="eyebrow sc">Admin</span>
    <h1>Welcome <em>back</em>.</h1>
    <p>Edit stories, photos, and (soon) colors.</p>
    <input id="pw" type="password" placeholder="Password" autofocus>
    <button type="submit">Enter</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<!-- ───── App ───── -->
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">Szabina<em>admin</em></div>
    <div class="actions">
      <a href="/" target="_blank">View site ↗</a>
      <button id="logout">Sign out</button>
    </div>
  </header>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="savebar" id="savebar">
    <span class="status" id="savestatus">No changes</span>
    <div class="btns">
      <button id="btn-discard" type="button">Discard</button>
      <button class="save" id="btn-save" type="button">Save</button>
    </div>
  </div>
  <main class="editor empty" id="editor">Pick a story on the left.</main>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Auth + state ────────────────────────────────────────────────────────
const state = {
  password: sessionStorage.getItem('admin-pw') || null,
  travel: null,    // {data, sha}
  portrait: null,  // {data, sha}
  activeCategory: null,  // 'travel' | 'portrait'
  activeIdx: null,
};

const loginEl = document.getElementById('login');
const appEl = document.getElementById('app');
const errEl = document.getElementById('login-err');
const sidebarEl = document.getElementById('sidebar');
const editorEl = document.getElementById('editor');
const toastEl = document.getElementById('toast');

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  errEl.textContent = '';
  try {
    const r = await api('login', null, pw);
    if (!r.ok) throw new Error(r.error || 'Login failed');
    state.password = pw;
    sessionStorage.setItem('admin-pw', pw);
    await boot();
  } catch (err) {
    errEl.textContent = err.message;
  }
});

document.getElementById('logout').addEventListener('click', () => {
  state.password = null;
  sessionStorage.removeItem('admin-pw');
  location.reload();
});

// On page load: if password is cached, try to use it
if (state.password) boot().catch(() => {
  // Cached password didn't work — clear and show login
  state.password = null;
  sessionStorage.removeItem('admin-pw');
});

// ─── API helper ──────────────────────────────────────────────────────────
async function api(action, payload, pw) {
  const body = { password: pw ?? state.password, action, ...(payload || {}) };
  const res = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ─── Boot: load stories, paint sidebar ───────────────────────────────────
async function boot() {
  loginEl.style.display = 'none';
  appEl.classList.add('live');

  toast('Loading stories…');
  const [t, p] = await Promise.all([
    api('read', { path: 'data/travel.json' }),
    api('read', { path: 'data/portrait.json' }),
  ]);
  if (!t.ok || !p.ok) throw new Error(t.error || p.error || 'Read failed');

  state.travel = { data: t.data, sha: t.sha };
  state.portrait = { data: p.data, sha: p.sha };

  renderSidebar();
  toast('Loaded ' + t.data.length + ' travel + ' + p.data.length + ' portrait stories');
}

function renderSidebar() {
  sidebarEl.innerHTML = '';
  for (const [cat, label] of [['travel','Travel'], ['portrait','Portrait']]) {
    const h = document.createElement('h2');
    h.innerHTML = `<span>${label} (${state[cat].data.length})</span><button class="new-btn" type="button">+ New</button>`;
    h.querySelector('.new-btn').addEventListener('click', () => createStory(cat));
    sidebarEl.appendChild(h);
    state[cat].data.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'story-item' + (s._isNew ? ' new' : '');
      btn.draggable = true;
      btn.dataset.cat = cat;
      btn.dataset.idx = i;
      const title = (s.title?.[0] || '') + ' ' + (s.title?.[1] || '');
      btn.innerHTML = `
        <span class="num">${s.num || ''}</span>
        <span class="title">${title}</span>
        <div class="sub">${s.shortPlace || ''}</div>
      `;
      btn.addEventListener('click', () => selectStory(cat, i));
      sidebarEl.appendChild(btn);
    });
  }
}

// ─── New story ───────────────────────────────────────────────────────────
const ROMAN = [['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
function toRoman(n) {
  let s = ''; for (const [r, v] of ROMAN) while (n >= v) { s += r; n -= v; }
  return s;
}

function nextId(cat) {
  const prefix = cat === 'travel' ? 's' : 'p';
  let max = 0;
  for (const s of state[cat].data) {
    const m = (s.id || '').match(new RegExp(`^${prefix}(\\d+)$`));
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  return prefix + String(max + 1).padStart(2, '0');
}

function createStory(cat) {
  if (state.draft && isDirty()) {
    if (!confirm('You have unsaved changes on the current story. Discard them and create a new one?')) return;
  }
  const id = nextId(cat);
  const num = toRoman(state[cat].data.length + 1);
  const today = new Date();
  const dateStr = String(today.getDate()).padStart(2,'0') + ' · ' + toRoman(today.getMonth() + 1) + ' · ' + String(today.getFullYear()).slice(-2);

  const newStory = {
    id, num,
    coverExt: 'jpg',
    cover: 1,
    count: 0,
    date: dateStr,
    place: 'New place · location',
    title: ['New story', '<em>title</em>.'],
    caption: 'Caption goes here. Edit me before saving.',
    shortPlace: 'New',
    images: [],
    _isNew: true,  // local-only marker (stripped on save)
  };
  state[cat].data.push(newStory);
  renderSidebar();
  selectStory(cat, state[cat].data.length - 1);
  toast(`Created ${id} — fill it in and Save`);
}

function selectStory(cat, idx) {
  // Warn if dirty before switching
  if (state.draft && isDirty()) {
    if (!confirm('You have unsaved changes. Discard them?')) return;
  }
  state.activeCategory = cat;
  state.activeIdx = idx;
  // Clone the story so edits don't mutate the source until Save
  const original = state[cat].data[idx];
  state.draft = JSON.parse(JSON.stringify(original));
  state.original = original;

  document.querySelectorAll('.story-item').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat && +b.dataset.idx === idx);
  });
  renderEditor();
}

function isDirty() {
  if (!state.draft || !state.original) return false;
  return JSON.stringify(state.draft) !== JSON.stringify(state.original);
}

function renderEditor() {
  const s = state.draft;
  editorEl.classList.remove('empty');
  const folder = s.id;
  const images = s.images || [];
  const coverIdx = (s.cover || 1) - 1;
  const title0 = s.title?.[0] || '';
  const title1 = s.title?.[1] || '';

  editorEl.innerHTML = `
    <form class="form" id="editform" autocomplete="off">
      <div class="field-row">
        <div class="field">
          <label for="f-place">Place</label>
          <input id="f-place" data-path="place">
        </div>
        <div class="field">
          <label for="f-date">Date</label>
          <input id="f-date" data-path="date">
        </div>
      </div>

      <div class="field">
        <label for="f-shortPlace">Short place <span class="hint">(shown in side rail)</span></label>
        <input id="f-shortPlace" data-path="shortPlace">
      </div>

      <div class="field">
        <label for="f-title0">Title — line 1</label>
        <input id="f-title0" class="big" data-path="title.0">
      </div>

      <div class="field">
        <label for="f-title1">Title — line 2 <span class="hint">use <code>&lt;em&gt;word&lt;/em&gt;</code> for italic</span></label>
        <input id="f-title1" class="big" data-path="title.1">
      </div>

      <div class="field">
        <label for="f-caption">Caption</label>
        <textarea id="f-caption" data-path="caption" rows="4"></textarea>
      </div>
    </form>

    <div class="preview-wrap">
      <div class="lbl">Preview — how the cover will read</div>
      <div class="preview" id="preview">
        <h2 id="pv-title"></h2>
        <p class="caption" id="pv-caption"></p>
      </div>
    </div>

    <dl class="meta-grid">
      <div><dt>id</dt><dd>${s.id}</dd></div>
      <div><dt>image count</dt><dd>${images.length}</dd></div>
      <div><dt>cover</dt><dd>${images[coverIdx] || '—'}</dd></div>
      <div><dt>category</dt><dd>${state.activeCategory}</dd></div>
    </dl>

    <div class="images" id="image-grid">
      <h3>Photos (${images.length}) — drag to reorder · hover for ⭐ cover / ✕ delete</h3>
      <label class="upload-tile" id="upload-tile">
        <span class="plus">+</span>
        <span class="lbl" id="upload-lbl">Add photo(s)</span>
        <input type="file" id="file-upload" accept="image/*" multiple hidden>
      </label>
      ${images.map((fn, i) => {
        const isHidden = (s.hiddenInGallery || []).includes(fn);
        return `
        <div class="thumb${i === coverIdx ? ' cover' : ''}${isHidden ? ' hidden-in-gallery' : ''}" draggable="true" data-idx="${i}" data-filename="${escAttr(fn)}" style="background-image:url('images/${folder}/${fn}')">
          ${i === coverIdx ? '<span class="badge">COVER</span>' : ''}
          <div class="controls">
            <button class="set-cover" title="Make cover">⭐</button>

            <button class="del" title="Delete photo">✕</button>

        </div>
      `;}).join('')}
    </div>

    <section class="danger">
      <h3>Danger zone</h3>
      <p>Deleting this story removes it from the JSON and renumbers everything after it. Photo files stay in git history; they're orphaned in the repo but recoverable.</p>

  // Wire inputs → populate values (with entity decoding) + listen for edits
  editorEl.querySelectorAll('[data-path]').forEach(input => {
    const path = input.dataset.path;
    const raw = path.includes('.')
      ? (state.draft[path.split('.')[0]] || [])[+path.split('.')[1]]
      : state.draft[path];
    input.value = decodeEntities(raw || '');
    input.addEventListener('input', onFieldChange);
  });

  wireImageControls();
  document.getElementById('btn-delete-story').addEventListener('click', deleteStory);

  // Savebar is persistent in DOM — reveal it now
  document.getElementById('savebar').classList.add('live');
  refreshPreview();
  refreshSavebar();
}

// ─── Delete + reorder stories (renumber after structural changes) ───────
function renumber(arr) {
  return arr.map((s, i) => ({ ...s, num: toRoman(i + 1) }));
}

// Drag-to-reorder stories. Restricted to same-category drops.
let dragStoryFrom = null;
function setupSidebarDrag() {
  // Listeners attach to the sidebar container once; works for elements rerendered later
  sidebarEl.addEventListener('dragstart', e => {
    const item = e.target.closest('.story-item');
    if (!item) return;
    dragStoryFrom = { cat: item.dataset.cat, idx: +item.dataset.idx };
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  sidebarEl.addEventListener('dragend', () => {
    document.querySelectorAll('.story-item').forEach(i =>
      i.classList.remove('dragging', 'drop-before', 'drop-after'));
    dragStoryFrom = null;
  });
  sidebarEl.addEventListener('dragover', e => {
    const item = e.target.closest('.story-item');
    if (!item || !dragStoryFrom) return;
    if (item.dataset.cat !== dragStoryFrom.cat) return;  // same-category only
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.story-item').forEach(i =>
      i.classList.remove('drop-before', 'drop-after'));
    const rect = item.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    item.classList.add(before ? 'drop-before' : 'drop-after');
  });
  sidebarEl.addEventListener('drop', async e => {
    const item = e.target.closest('.story-item');
    if (!item || !dragStoryFrom) return;
    if (item.dataset.cat !== dragStoryFrom.cat) return;
    e.preventDefault();
    const targetIdx = +item.dataset.idx;
    const rect = item.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    let toIdx = before ? targetIdx : targetIdx + 1;
    if (toIdx > dragStoryFrom.idx) toIdx--;
    if (toIdx === dragStoryFrom.idx) return;
    await reorderStory(dragStoryFrom.cat, dragStoryFrom.idx, toIdx);
  });
}
setupSidebarDrag();  // safe to wire once at script load — sidebarEl is in DOM

async function reorderStory(cat, fromIdx, toIdx) {
  // Block reorder if there are uncommitted text edits on the active story
  if (state.draft && isDirty()) {
    if (!confirm('You have unsaved text edits on the current story. Discard them to commit the reorder?')) return;
  }

  const arr = state[cat].data.slice();
  const [moved] = arr.splice(fromIdx, 1);
  arr.splice(toIdx, 0, moved);
  const newArr = renumber(arr).map(({ _isNew, ...clean }) => clean);

  toast('Reordering…');
  try {
    const r = await api('write-json', {
      path: 'data/' + cat + '.json',
      content: newArr,
      sha: state[cat].sha,
      message: `admin: reorder ${cat}`,
    });
    if (!r.ok) throw new Error(r.error || 'Reorder failed');

    state[cat].data = newArr;
    state[cat].sha = r.sha;

    // If the active story is in this category, recompute its index after the move
    if (state.activeCategory === cat && state.activeIdx !== null) {
      let a = state.activeIdx;
      if (a === fromIdx) a = toIdx;
      else if (fromIdx < a && toIdx >= a) a--;
      else if (fromIdx > a && toIdx <= a) a++;
      state.activeIdx = a;
      state.original = state[cat].data[a];
      state.draft = JSON.parse(JSON.stringify(state.original));
    }

    renderSidebar();
    if (state.activeIdx !== null) {
      document.querySelectorAll('.story-item').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === state.activeCategory && +b.dataset.idx === state.activeIdx);
      });
      renderEditor();
    }
    toast('Reordered — saved');
  } catch (err) {
    toast(err.message, true);
  }
}

async function deleteStory() {
  const cat = state.activeCategory;
  const idx = state.activeIdx;
  const s = state[cat].data[idx];
  const label = `${s.num} · ${decodeEntities((s.title?.[0] || '') + ' ' + (s.title?.[1] || ''))}`.trim();

  if (!confirm(`Delete "${label}"?\n\nRemoves story ${s.id} from ${cat}.json and renumbers everything below it.\nPhoto files in images/${s.id}/ are NOT deleted (git history keeps them).`)) return;

  // If this was a brand-new unsaved story, just drop it locally.
  if (s._isNew) {
    state[cat].data.splice(idx, 1);
    state.draft = null;
    state.original = null;
    state.activeIdx = null;
    state.activeCategory = null;
    renderSidebar();
    editorEl.classList.add('empty');
    editorEl.textContent = 'Pick a story on the left.';
    document.getElementById('savebar').classList.remove('live');
    toast('New story discarded');
    return;
  }

  toast('Deleting…');
  const newArr = renumber(state[cat].data.filter((_, i) => i !== idx));
  try {
    const r = await api('write-json', {
      path: 'data/' + cat + '.json',
      content: newArr,
      sha: state[cat].sha,
      message: 'admin: delete ' + s.id,
    });
    if (!r.ok) throw new Error(r.error || 'Delete failed');

    state[cat].data = newArr;
    state[cat].sha = r.sha;
    state.draft = null;
    state.original = null;
    state.activeIdx = null;
    state.activeCategory = null;

    renderSidebar();
    editorEl.classList.add('empty');
    editorEl.textContent = 'Pick a story on the left.';
    document.getElementById('savebar').classList.remove('live');
    toast(`Deleted ${s.id}`);
  } catch (err) {
    toast(err.message, true);
  }
}

// ─── Image grid handlers ────────────────────────────────────────────────
function wireImageControls() {
  const grid = document.getElementById('image-grid');
  if (!grid) return;

  // Upload — supports multi-file selection; uploads sequentially
  document.getElementById('file-upload').addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    if (files.length) handleUploads(files);
    e.target.value = ''; // reset so same file(s) can be re-picked later
  });

  // Per-thumb controls (delegate)
  grid.addEventListener('click', e => {
    const thumb = e.target.closest('.thumb');
    if (!thumb) return;
    const idx = +thumb.dataset.idx;
    const filename = thumb.dataset.filename;
    if (e.target.classList.contains('set-cover')) {
      state.draft.cover = idx + 1; // 1-based
      renderEditor();
      refreshSavebar();
      toast('Cover updated — Save to publish');
    } else if (e.target.classList.contains('hide-toggle')) {
      state.draft.hiddenInGallery = state.draft.hiddenInGallery || [];
      const i = state.draft.hiddenInGallery.indexOf(filename);
      if (i >= 0) state.draft.hiddenInGallery.splice(i, 1);
      else state.draft.hiddenInGallery.push(filename);
      renderEditor();
      refreshSavebar();
      toast(i >= 0 ? 'Shown in gallery — Save to publish' : 'Hidden from gallery — Save to publish');
    } else if (e.target.classList.contains('del')) {
      handleDelete(idx, thumb.dataset.filename);
    }
  });

  // Drag-to-reorder
  let dragFromIdx = null;
  grid.addEventListener('dragstart', e => {
    const thumb = e.target.closest('.thumb');
    if (!thumb) return;
    dragFromIdx = +thumb.dataset.idx;
    thumb.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  grid.addEventListener('dragend', e => {
    grid.querySelectorAll('.thumb').forEach(t => {
      t.classList.remove('dragging','drop-before','drop-after');
    });
    dragFromIdx = null;
  });
  grid.addEventListener('dragover', e => {
    const thumb = e.target.closest('.thumb');
    if (!thumb || dragFromIdx === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const overIdx = +thumb.dataset.idx;
    grid.querySelectorAll('.thumb').forEach(t => t.classList.remove('drop-before','drop-after'));
    const rect = thumb.getBoundingClientRect();
    const before = (e.clientX - rect.left) < rect.width / 2;
    thumb.classList.add(before ? 'drop-before' : 'drop-after');
  });
  grid.addEventListener('drop', e => {
    const thumb = e.target.closest('.thumb');
    if (!thumb || dragFromIdx === null) return;
    e.preventDefault();
    const overIdx = +thumb.dataset.idx;
    const rect = thumb.getBoundingClientRect();
    const before = (e.clientX - rect.left) < rect.width / 2;
    let toIdx = before ? overIdx : overIdx + 1;
    if (toIdx > dragFromIdx) toIdx--; // account for removing source first
    if (toIdx === dragFromIdx) return;
    reorderImage(dragFromIdx, toIdx);
  });
}

function reorderImage(from, to) {
  const arr = state.draft.images;
  const wasCover = (state.draft.cover - 1) === from;
  const [moved] = arr.splice(from, 1);
  arr.splice(to, 0, moved);
  // Track cover by which filename it points to
  if (wasCover) state.draft.cover = to + 1;
  else {
    const coverFn = state.original.images[(state.original.cover || 1) - 1];
    const newCoverIdx = arr.indexOf(coverFn);
    if (newCoverIdx >= 0) state.draft.cover = newCoverIdx + 1;
  }
  renderEditor();
  refreshSavebar();
}

async function handleDelete(idx, filename) {
  if (!confirm(`Delete photo "${filename}"?\n\nThis removes it from GitHub immediately. Git history keeps a copy.`)) return;
  const folder = state.draft.id;
  const path = `images/${folder}/${filename}`;
  toast('Deleting ' + filename + '…');
  try {
    const r = await api('delete-file', { path, message: 'admin: delete ' + path });
    if (!r.ok) throw new Error(r.error || 'Delete failed');
    // Remove from draft.images + clean up hiddenInGallery if present
    const wasCover = (state.draft.cover - 1) === idx;
    state.draft.images.splice(idx, 1);
    if (state.draft.hiddenInGallery) {
      state.draft.hiddenInGallery = state.draft.hiddenInGallery.filter(f => f !== filename);
    }
    if (wasCover) state.draft.cover = 1;
    else if (state.draft.cover - 1 > idx) state.draft.cover--;
    state.draft.count = state.draft.images.length;
    renderEditor();
    refreshSavebar();
    toast('Deleted — Save to publish the JSON change');
  } catch (err) {
    toast(err.message, true);
  }
}

async function handleUploads(files) {
  const folder = state.draft.id;
  const tile = document.getElementById('upload-tile');
  const lbl = document.getElementById('upload-lbl');
  tile.classList.add('busy');

  let okCount = 0;
  const total = files.length;
  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const prefix = total > 1 ? `(${i + 1}/${total}) ` : '';
      try {
        lbl.textContent = `${prefix}Reading…`;
        const filename = await pickFilename(file.name, folder);
        const b64 = await fileToBase64(file);

        lbl.textContent = `${prefix}Uploading…`;
        const path = `images/${folder}/${filename}`;
        const r = await api('upload-image', { path, contentBase64: b64, message: 'admin: upload ' + path });
        if (!r.ok) throw new Error(r.error || 'Upload failed');

        state.draft.images.push(filename);
        state.draft.count = state.draft.images.length;
        okCount++;
        // Re-render only at end (or every file? every file is more responsive)
        renderEditor();
        refreshSavebar();
      } catch (err) {
        toast(`${file.name}: ${err.message}`, true);
      }
    }
    if (okCount) {
      toast(`Uploaded ${okCount}${total > 1 ? ` of ${total}` : ''} — Save to publish the JSON change`);
    }
  } finally {
    tile.classList.remove('busy');
    lbl.textContent = 'Add photo(s)';
  }
}

// Strip path, normalize spaces, suffix with -2/-3 if conflict in current draft
async function pickFilename(originalName, folder) {
  const base = originalName.split(/[\/\\]/).pop().replace(/\s+/g, '-');
  const taken = new Set(state.draft.images);
  if (!taken.has(base)) return base;
  const dot = base.lastIndexOf('.');
  const stem = dot > 0 ? base.slice(0, dot) : base;
  const ext = dot > 0 ? base.slice(dot) : '';
  for (let i = 2; i < 1000; i++) {
    const candidate = `${stem}-${i}${ext}`;
    if (!taken.has(candidate)) return candidate;
  }
  throw new Error('Could not pick a unique filename');
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      // result is "data:image/jpeg;base64,...."; strip the prefix
      const idx = reader.result.indexOf(',');
      resolve(reader.result.slice(idx + 1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Wire savebar buttons once at startup (delegated to global handlers)
document.getElementById('btn-save').addEventListener('click', save);
document.getElementById('btn-discard').addEventListener('click', discard);

// Browser-native HTML entity decoder — turns "I&rsquo;m" into "I'm" for editing
function decodeEntities(s) {
  const ta = document.createElement('textarea');
  ta.innerHTML = String(s ?? '');
  return ta.value;
}

function onFieldChange(e) {
  const path = e.target.dataset.path;
  const val = e.target.value;
  // Path supports "title.0" / "title.1" for the two-line title
  if (path.includes('.')) {
    const [k, idx] = path.split('.');
    if (!Array.isArray(state.draft[k])) state.draft[k] = [];
    state.draft[k][+idx] = val;
  } else {
    state.draft[path] = val;
  }
  refreshPreview();
  refreshSavebar();
  // Also update the sidebar entry's visible title/place live
  updateSidebarItem();
}

function refreshPreview() {
  const s = state.draft;
  const pvTitle = document.getElementById('pv-title');
  const pvCap = document.getElementById('pv-caption');
  if (!pvTitle) return;
  pvTitle.innerHTML = (s.title?.[0] || '') + ' ' + (s.title?.[1] || '');
  pvCap.innerHTML = s.caption || '';
}

function refreshSavebar() {
  const dirty = isDirty();
  const ss = document.getElementById('savestatus');
  const saveBtn = document.getElementById('btn-save');
  const discardBtn = document.getElementById('btn-discard');
  if (!ss) return;
  ss.className = 'status' + (dirty ? ' dirty' : '');
  ss.textContent = dirty ? 'Unsaved changes' : 'No changes';
  saveBtn.disabled = !dirty;
  discardBtn.disabled = !dirty;
}

function updateSidebarItem() {
  const s = state.draft;
  const btn = document.querySelector(`.story-item[data-cat="${state.activeCategory}"][data-idx="${state.activeIdx}"]`);
  if (!btn) return;
  btn.querySelector('.title').innerHTML = (s.title?.[0] || '') + ' ' + (s.title?.[1] || '');
  btn.querySelector('.sub').textContent = s.shortPlace || '';
}

function discard() {
  state.draft = JSON.parse(JSON.stringify(state.original));
  renderEditor();
  toast('Discarded');
}

async function save() {
  const cat = state.activeCategory;
  const ss = document.getElementById('savestatus');
  const saveBtn = document.getElementById('btn-save');
  const discardBtn = document.getElementById('btn-discard');

  // Build new array with the draft replacing the active story, strip the
  // internal `_isNew` marker, and recompute `num` from array position so
  // Roman numerals always reflect current order.
  const newArr = state[cat].data.map((s, i) => {
    const src = i === state.activeIdx ? state.draft : s;
    const { _isNew, ...clean } = src;
    return { ...clean, num: toRoman(i + 1) };
  });

  ss.className = 'status saving';
  ss.textContent = 'Saving…';
  saveBtn.disabled = true;
  discardBtn.disabled = true;

  try {
    const r = await api('write-json', {
      path: 'data/' + cat + '.json',
      content: newArr,
      sha: state[cat].sha,
      message: 'admin: edit ' + state.draft.id,
    });
    if (!r.ok) throw new Error(r.error || 'Save failed');

    // Update in-memory state (newArr already has _isNew stripped)
    state[cat].data = newArr;
    state[cat].sha = r.sha;
    state.original = state[cat].data[state.activeIdx];
    state.draft = JSON.parse(JSON.stringify(state.original));
    renderSidebar();  // refresh sidebar so the ✨ "new" badge clears once saved
    // Restore selection highlight that renderSidebar wiped
    document.querySelectorAll('.story-item').forEach(b => {
      b.classList.toggle('active', b.dataset.cat === state.activeCategory && +b.dataset.idx === state.activeIdx);
    });

    ss.className = 'status saved';
    ss.textContent = 'Saved · commit ' + (r.commit || '').slice(0,7);
    setTimeout(refreshSavebar, 2500);
    toast('Saved');
  } catch (err) {
    ss.className = 'status err';
    ss.textContent = 'Error: ' + err.message;
    saveBtn.disabled = false;
    discardBtn.disabled = false;
    toast(err.message, true);
  }
}

// ─── Escapers for attribute and text content ─────────────────────────────
function escAttr(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
}

// ─── Toast ───────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, isErr = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isErr);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}
</script>
