<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Szabina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0c05;
    --paper:#faf2e0;
    --paper-dim:rgba(250,242,224,0.78);
    --paper-faint:rgba(250,242,224,0.18);
    --terra:#b8401b;
    --terra-deep:#7a2a10;
    --ok:#6f9d5d;
    --warn:#c0833a;
    --err:#c44a3e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--paper);
    font-family:"Cormorant Garamond", Georgia, serif;font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace}
  .sc{font-family:"IBM Plex Mono", monospace;text-transform:uppercase;letter-spacing:0.22em;font-size:11px}

  /* ───────── Login screen ───────── */
  .login{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login form{
    width:100%;max-width:380px;
    display:flex;flex-direction:column;gap:18px;
  }
  .login .eyebrow{color:var(--terra);margin-bottom:6px}
  .login h1{
    font-weight:300;font-size:clamp(36px,5vw,52px);
    line-height:1;letter-spacing:-0.015em;
    margin-bottom:8px;
  }
  .login h1 em{font-style:italic;color:var(--terra-deep)}
  .login p{color:var(--paper-dim);font-style:italic;font-size:17px;line-height:1.5;margin-bottom:8px}
  .login input{
    width:100%;padding:14px 16px;
    background:rgba(250,242,224,0.05);
    border:1px solid var(--paper-faint);
    border-radius:10px;
    color:var(--paper);font-family:inherit;font-size:17px;
    transition:border-color .2s,background .2s;
  }
  .login input:focus{outline:0;border-color:var(--terra);background:rgba(250,242,224,0.08)}
  .login button{
    padding:14px 22px;font-family:inherit;font-size:14px;
    background:var(--terra);color:var(--paper);
    border:0;border-radius:10px;cursor:pointer;
    letter-spacing:0.2em;text-transform:uppercase;
    transition:background .2s;
  }
  .login button:hover{background:var(--terra-deep)}
  .login .err{color:var(--err);font-size:13px;font-style:italic;min-height:1.4em}

  /* ───────── App layout (after login) ───────── */
  .app{display:none;height:100vh;grid-template-rows:auto 1fr;grid-template-columns:320px 1fr}
  .app.live{display:grid}

  .topbar{
    grid-column:1/-1;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;
    border-bottom:1px solid var(--paper-faint);
    background:rgba(0,0,0,0.25);
  }
  .topbar .brand{font-size:14px;letter-spacing:0.32em;text-transform:uppercase;font-weight:500}
  .topbar .brand em{font-style:italic;color:var(--terra);text-transform:none;letter-spacing:0;font-weight:300;font-size:18px;margin-left:8px}
  .topbar .actions{display:flex;gap:8px;align-items:center}
  .topbar a, .topbar button{
    color:var(--paper-dim);background:transparent;border:0;
    font-family:inherit;font-size:13px;cursor:pointer;
    padding:6px 12px;border-radius:6px;
    transition:color .2s,background .2s;
  }
  .topbar a:hover, .topbar button:hover{color:var(--paper);background:rgba(250,242,224,0.06)}

  /* Story list (left) */
  .sidebar{
    border-right:1px solid var(--paper-faint);
    overflow-y:auto;
    padding:8px 0;
  }
  .sidebar h2{
    font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:0.22em;
    font-size:10px;font-weight:400;color:var(--paper-dim);
    padding:14px 22px 8px;
  }
  .story-item{
    display:block;width:100%;text-align:left;
    background:transparent;border:0;color:var(--paper);
    font-family:inherit;cursor:pointer;
    padding:10px 22px;
    border-left:2px solid transparent;
    transition:background .15s,border-color .15s;
  }
  .story-item:hover{background:rgba(250,242,224,0.04)}
  .story-item.active{background:rgba(184,64,27,0.12);border-left-color:var(--terra)}
  .story-item .num{
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--paper-dim);
    letter-spacing:0.18em;margin-right:10px;
  }
  .story-item .title{font-size:17px;line-height:1.25}
  .story-item .title em{font-style:italic;color:#ffb88c}
  .story-item .sub{
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--paper-dim);
    letter-spacing:0.1em;margin-top:4px;text-transform:uppercase;
  }

  /* Editor (right) */
  .editor{
    overflow-y:auto;
    padding:32px 48px;
  }
  .editor.empty{
    display:flex;align-items:center;justify-content:center;
    color:var(--paper-dim);font-style:italic;font-size:19px;
  }
  .editor .row{display:flex;gap:24px;align-items:baseline;margin-bottom:20px}
  .editor .row .num{
    font-family:"Cormorant Garamond",serif;font-style:italic;
    font-size:48px;color:var(--terra);line-height:1;
  }
  .editor .row .place{color:var(--paper-dim);font-size:14px;letter-spacing:0.18em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
  .editor h2{
    font-weight:300;font-size:clamp(36px,4vw,56px);line-height:1;
    letter-spacing:-0.015em;margin-bottom:18px;
  }
  .editor h2 em{font-style:italic;color:#ffb88c}
  .editor .caption{
    font-style:italic;font-size:19px;line-height:1.55;color:var(--paper-dim);
    max-width:60ch;margin-bottom:32px;
  }
  .editor .meta-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:18px 32px;
    margin-bottom:28px;font-size:14px;
    border-top:1px solid var(--paper-faint);padding-top:24px;
  }
  .editor .meta-grid dt{
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;
  }
  .editor .meta-grid dd{font-family:"IBM Plex Mono",monospace;font-size:13px;margin-top:4px}
  .editor .images{
    border-top:1px solid var(--paper-faint);padding-top:24px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px;
  }

  /* ───── Edit form ───── */
  .savebar{
    position:sticky;top:0;z-index:5;
    margin:-32px -48px 32px;padding:16px 48px;
    background:#1a0c05;
    border-bottom:1px solid var(--paper-faint);
    box-shadow:0 8px 18px -8px rgba(0,0,0,0.6);
    display:flex;justify-content:space-between;align-items:center;gap:14px;
  }
  .savebar .status{color:var(--paper-dim);font-size:13px;font-style:italic}
  .savebar .status.dirty{color:var(--warn)}
  .savebar .status.saving{color:var(--paper-dim)}
  .savebar .status.saved{color:var(--ok)}
  .savebar .status.err{color:var(--err)}
  .savebar .btns{display:flex;gap:8px}
  .savebar button{
    padding:8px 18px;font-family:inherit;font-size:12px;
    border:1px solid var(--paper-faint);border-radius:6px;cursor:pointer;
    background:transparent;color:var(--paper);
    letter-spacing:0.18em;text-transform:uppercase;
    transition:background .15s,border-color .15s,color .15s;
  }
  .savebar button:hover:not(:disabled){background:rgba(250,242,224,0.08)}
  .savebar button.save{background:var(--terra);border-color:var(--terra)}
  .savebar button.save:hover:not(:disabled){background:var(--terra-deep);border-color:var(--terra-deep)}
  .savebar button:disabled{opacity:.4;cursor:not-allowed}

  .form{display:flex;flex-direction:column;gap:18px;margin-bottom:32px}
  .form .field{display:flex;flex-direction:column;gap:6px}
  .form .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .form label{
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;
  }
  .form input, .form textarea{
    background:rgba(250,242,224,0.04);
    border:1px solid var(--paper-faint);border-radius:8px;
    color:var(--paper);font-family:inherit;
    padding:12px 14px;
    transition:border-color .15s,background .15s;
  }
  .form input:focus, .form textarea:focus{
    outline:0;border-color:var(--terra);background:rgba(250,242,224,0.08);
  }
  .form textarea{resize:vertical;min-height:90px;font-size:17px;font-style:italic;line-height:1.5}
  .form input.big{font-size:28px;font-weight:300;line-height:1.1;letter-spacing:-0.01em;padding:14px 16px}
  .form .hint{
    color:var(--paper-dim);font-size:11px;font-style:italic;
    font-family:"IBM Plex Mono",monospace;letter-spacing:0;
  }
  .form .hint code{
    background:rgba(250,242,224,0.08);padding:1px 5px;border-radius:3px;
    font-size:10px;color:#ffb88c;
  }

  .preview-wrap{
    border-top:1px solid var(--paper-faint);
    padding-top:24px;margin-bottom:32px;
  }
  .preview-wrap > .lbl{
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    margin-bottom:12px;
  }
  .preview{
    background:rgba(250,242,224,0.03);
    border-radius:10px;padding:24px;
  }
  .preview h2{
    font-weight:300;font-size:clamp(28px,3vw,42px);line-height:1;
    letter-spacing:-0.015em;margin-bottom:14px;
  }
  .preview h2 em{font-style:italic;color:#ffb88c}
  .preview .caption{
    font-style:italic;font-size:17px;line-height:1.55;color:var(--paper-dim);
    max-width:60ch;
  }
  .editor .images h3{
    grid-column:1/-1;
    color:var(--paper-dim);text-transform:uppercase;letter-spacing:0.18em;
    font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:400;
    margin-bottom:4px;
  }
  .editor .images .thumb{
    aspect-ratio:1;position:relative;
    background:#000 center/cover no-repeat;
    border-radius:6px;
    border:1px solid var(--paper-faint);
  }
  .editor .images .thumb.cover{border-color:var(--terra);border-width:2px}
  .editor .images .thumb .badge{
    position:absolute;top:6px;left:6px;
    background:var(--terra);color:var(--paper);
    font-family:"IBM Plex Mono",monospace;font-size:9px;
    padding:2px 6px;border-radius:3px;letter-spacing:0.1em;
  }
  .editor .images .thumb .seq{
    position:absolute;bottom:6px;right:6px;
    background:rgba(0,0,0,0.6);color:var(--paper);
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    padding:2px 6px;border-radius:3px;
  }

  .toast{
    position:fixed;bottom:24px;right:24px;
    padding:14px 22px;border-radius:10px;
    background:rgba(0,0,0,0.8);border:1px solid var(--paper-faint);
    color:var(--paper);font-size:13px;
    opacity:0;transform:translateY(8px);
    transition:opacity .2s,transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{border-color:var(--err);color:var(--err)}
</style>
</head>
<body>

<!-- ───── Login ───── -->
<section class="login" id="login">
  <form id="login-form" autocomplete="off">
    <span class="eyebrow sc">Admin</span>
    <h1>Welcome <em>back</em>.</h1>
    <p>Edit stories, photos, and (soon) colors.</p>
    <input id="pw" type="password" placeholder="Password" autofocus>
    <button type="submit">Enter</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<!-- ───── App ───── -->
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">Szabina<em>admin</em></div>
    <div class="actions">
      <a href="/" target="_blank">View site ↗</a>
      <button id="logout">Sign out</button>
    </div>
  </header>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="editor empty" id="editor">Pick a story on the left.</main>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Auth + state ────────────────────────────────────────────────────────
const state = {
  password: sessionStorage.getItem('admin-pw') || null,
  travel: null,    // {data, sha}
  portrait: null,  // {data, sha}
  activeCategory: null,  // 'travel' | 'portrait'
  activeIdx: null,
};

const loginEl = document.getElementById('login');
const appEl = document.getElementById('app');
const errEl = document.getElementById('login-err');
const sidebarEl = document.getElementById('sidebar');
const editorEl = document.getElementById('editor');
const toastEl = document.getElementById('toast');

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  errEl.textContent = '';
  try {
    const r = await api('login', null, pw);
    if (!r.ok) throw new Error(r.error || 'Login failed');
    state.password = pw;
    sessionStorage.setItem('admin-pw', pw);
    await boot();
  } catch (err) {
    errEl.textContent = err.message;
  }
});

document.getElementById('logout').addEventListener('click', () => {
  state.password = null;
  sessionStorage.removeItem('admin-pw');
  location.reload();
});

// On page load: if password is cached, try to use it
if (state.password) boot().catch(() => {
  // Cached password didn't work — clear and show login
  state.password = null;
  sessionStorage.removeItem('admin-pw');
});

// ─── API helper ──────────────────────────────────────────────────────────
async function api(action, payload, pw) {
  const body = { password: pw ?? state.password, action, ...(payload || {}) };
  const res = await fetch('/api/admin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.json();
}

// ─── Boot: load stories, paint sidebar ───────────────────────────────────
async function boot() {
  loginEl.style.display = 'none';
  appEl.classList.add('live');

  toast('Loading stories…');
  const [t, p] = await Promise.all([
    api('read', { path: 'data/travel.json' }),
    api('read', { path: 'data/portrait.json' }),
  ]);
  if (!t.ok || !p.ok) throw new Error(t.error || p.error || 'Read failed');

  state.travel = { data: t.data, sha: t.sha };
  state.portrait = { data: p.data, sha: p.sha };

  renderSidebar();
  toast('Loaded ' + t.data.length + ' travel + ' + p.data.length + ' portrait stories');
}

function renderSidebar() {
  sidebarEl.innerHTML = '';
  for (const [cat, label] of [['travel','Travel'], ['portrait','Portrait']]) {
    const h = document.createElement('h2');
    h.textContent = label + ' (' + state[cat].data.length + ')';
    sidebarEl.appendChild(h);
    state[cat].data.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'story-item';
      btn.dataset.cat = cat;
      btn.dataset.idx = i;
      const title = (s.title?.[0] || '') + ' ' + (s.title?.[1] || '');
      btn.innerHTML = `
        <span class="num">${s.num || ''}</span>
        <span class="title">${title}</span>
        <div class="sub">${s.shortPlace || ''}</div>
      `;
      btn.addEventListener('click', () => selectStory(cat, i));
      sidebarEl.appendChild(btn);
    });
  }
}

function selectStory(cat, idx) {
  // Warn if dirty before switching
  if (state.draft && isDirty()) {
    if (!confirm('You have unsaved changes. Discard them?')) return;
  }
  state.activeCategory = cat;
  state.activeIdx = idx;
  // Clone the story so edits don't mutate the source until Save
  const original = state[cat].data[idx];
  state.draft = JSON.parse(JSON.stringify(original));
  state.original = original;

  document.querySelectorAll('.story-item').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat && +b.dataset.idx === idx);
  });
  renderEditor();
}

function isDirty() {
  if (!state.draft || !state.original) return false;
  return JSON.stringify(state.draft) !== JSON.stringify(state.original);
}

function renderEditor() {
  const s = state.draft;
  editorEl.classList.remove('empty');
  const folder = s.id;
  const images = s.images || [];
  const coverIdx = (s.cover || 1) - 1;
  const title0 = s.title?.[0] || '';
  const title1 = s.title?.[1] || '';

  editorEl.innerHTML = `
    <div class="savebar">
      <span class="status" id="savestatus">Loaded — ${s.id}</span>
      <div class="btns">
        <button id="btn-discard" type="button">Discard</button>
        <button class="save" id="btn-save" type="button">Save</button>
      </div>
    </div>

    <form class="form" id="editform" autocomplete="off">
      <div class="field-row">
        <div class="field">
          <label for="f-place">Place</label>
          <input id="f-place" data-path="place">
        </div>
        <div class="field">
          <label for="f-date">Date</label>
          <input id="f-date" data-path="date">
        </div>
      </div>

      <div class="field">
        <label for="f-shortPlace">Short place <span class="hint">(shown in side rail)</span></label>
        <input id="f-shortPlace" data-path="shortPlace">
      </div>

      <div class="field">
        <label for="f-title0">Title — line 1</label>
        <input id="f-title0" class="big" data-path="title.0">
      </div>

      <div class="field">
        <label for="f-title1">Title — line 2 <span class="hint">use <code>&lt;em&gt;word&lt;/em&gt;</code> for italic</span></label>
        <input id="f-title1" class="big" data-path="title.1">
      </div>

      <div class="field">
        <label for="f-caption">Caption</label>
        <textarea id="f-caption" data-path="caption" rows="4"></textarea>
      </div>
    </form>

    <div class="preview-wrap">
      <div class="lbl">Preview — how the cover will read</div>
      <div class="preview" id="preview">
        <h2 id="pv-title"></h2>
        <p class="caption" id="pv-caption"></p>
      </div>
    </div>

    <dl class="meta-grid">
      <div><dt>id</dt><dd>${s.id}</dd></div>
      <div><dt>image count</dt><dd>${images.length}</dd></div>
      <div><dt>cover</dt><dd>${images[coverIdx] || '—'}</dd></div>
      <div><dt>category</dt><dd>${state.activeCategory}</dd></div>
    </dl>

    <div class="images">
      <h3>Photos (${images.length}) — editing coming in Phase 3C</h3>
      ${images.map((fn, i) => `
        <div class="thumb${i === coverIdx ? ' cover' : ''}" style="background-image:url('images/${folder}/${fn}')">
          ${i === coverIdx ? '<span class="badge">COVER</span>' : ''}
          <span class="seq">${String(i+1).padStart(2,'0')}</span>
        </div>
      `).join('')}
    </div>
  `;

  // Wire inputs → populate values (with entity decoding) + listen for edits
  editorEl.querySelectorAll('[data-path]').forEach(input => {
    const path = input.dataset.path;
    const raw = path.includes('.')
      ? (state.draft[path.split('.')[0]] || [])[+path.split('.')[1]]
      : state.draft[path];
    input.value = decodeEntities(raw || '');
    input.addEventListener('input', onFieldChange);
  });
  document.getElementById('btn-save').addEventListener('click', save);
  document.getElementById('btn-discard').addEventListener('click', discard);
  refreshPreview();
  refreshSavebar();
}

// Browser-native HTML entity decoder — turns "I&rsquo;m" into "I'm" for editing
function decodeEntities(s) {
  const ta = document.createElement('textarea');
  ta.innerHTML = String(s ?? '');
  return ta.value;
}

function onFieldChange(e) {
  const path = e.target.dataset.path;
  const val = e.target.value;
  // Path supports "title.0" / "title.1" for the two-line title
  if (path.includes('.')) {
    const [k, idx] = path.split('.');
    if (!Array.isArray(state.draft[k])) state.draft[k] = [];
    state.draft[k][+idx] = val;
  } else {
    state.draft[path] = val;
  }
  refreshPreview();
  refreshSavebar();
  // Also update the sidebar entry's visible title/place live
  updateSidebarItem();
}

function refreshPreview() {
  const s = state.draft;
  const pvTitle = document.getElementById('pv-title');
  const pvCap = document.getElementById('pv-caption');
  if (!pvTitle) return;
  pvTitle.innerHTML = (s.title?.[0] || '') + ' ' + (s.title?.[1] || '');
  pvCap.innerHTML = s.caption || '';
}

function refreshSavebar() {
  const dirty = isDirty();
  const ss = document.getElementById('savestatus');
  const saveBtn = document.getElementById('btn-save');
  const discardBtn = document.getElementById('btn-discard');
  if (!ss) return;
  ss.className = 'status' + (dirty ? ' dirty' : '');
  ss.textContent = dirty ? 'Unsaved changes' : 'No changes';
  saveBtn.disabled = !dirty;
  discardBtn.disabled = !dirty;
}

function updateSidebarItem() {
  const s = state.draft;
  const btn = document.querySelector(`.story-item[data-cat="${state.activeCategory}"][data-idx="${state.activeIdx}"]`);
  if (!btn) return;
  btn.querySelector('.title').innerHTML = (s.title?.[0] || '') + ' ' + (s.title?.[1] || '');
  btn.querySelector('.sub').textContent = s.shortPlace || '';
}

function discard() {
  state.draft = JSON.parse(JSON.stringify(state.original));
  renderEditor();
  toast('Discarded');
}

async function save() {
  const cat = state.activeCategory;
  const ss = document.getElementById('savestatus');
  const saveBtn = document.getElementById('btn-save');
  const discardBtn = document.getElementById('btn-discard');

  // Build new array with the draft replacing the active story
  const newArr = state[cat].data.map((s, i) =>
    i === state.activeIdx ? state.draft : s
  );

  ss.className = 'status saving';
  ss.textContent = 'Saving…';
  saveBtn.disabled = true;
  discardBtn.disabled = true;

  try {
    const r = await api('write-json', {
      path: 'data/' + cat + '.json',
      content: newArr,
      sha: state[cat].sha,
      message: 'admin: edit ' + state.draft.id,
    });
    if (!r.ok) throw new Error(r.error || 'Save failed');

    // Update in-memory state
    state[cat].data = newArr;
    state[cat].sha = r.sha;
    state.original = state.draft;
    state.draft = JSON.parse(JSON.stringify(state.original));

    ss.className = 'status saved';
    ss.textContent = 'Saved · commit ' + (r.commit || '').slice(0,7);
    setTimeout(refreshSavebar, 2500);
    toast('Saved');
  } catch (err) {
    ss.className = 'status err';
    ss.textContent = 'Error: ' + err.message;
    saveBtn.disabled = false;
    discardBtn.disabled = false;
    toast(err.message, true);
  }
}

// ─── Escapers for attribute and text content ─────────────────────────────
function escAttr(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
}

// ─── Toast ───────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, isErr = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isErr);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}
</script>
